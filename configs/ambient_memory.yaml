# Demand Radar config — a THIRD product, to prove "swap one file, re-target".
# Runs on real, live data (Hacker News + Stack Overflow; Reddit on a residential IP).
#   python -m demand_radar configs/ambient_memory.yaml --live-ingest
name: ambient_memory
product: "An ambient memory layer that gives AI apps and agents persistent long-term memory across sessions"

pain_keywords:
  - "agent memory"
  - "long-term memory for llm"
  - "persistent memory"
  - "conversation memory"
  - "llm forgets"
  - "memory layer for ai"
  - "context window limit"
  - "vector memory"

sources:
  - "hn:comments"
  - "stackexchange:stackoverflow"
  - "stackexchange:softwareengineering"
  - "reddit:r/LocalLLaMA"
  - "reddit:r/MachineLearning"

segments_hint:
  - ai engineer
  - indie hacker
  - startup
  - enterprise
  - researcher

segment_keywords:
  ai engineer: ["ai engineer", "llm app", "building an agent", "my agent", "rag", "openai api", "langchain", "chatbot"]
  indie hacker: ["side project", "indie", "solo dev", "my saas", "building in public", "weekend project", "hobby"]
  startup: ["startup", "our startup", "founder", "we're building", "mvp", "seed", "small team"]
  enterprise: ["enterprise", "production", "our company", "large scale", "compliance", "on-prem", "self-host"]
  researcher: ["research", "paper", "phd", "experiment", "benchmark", "arxiv", "fine-tune"]

competitor_keywords: ["mem0", "zep", "letta", "memgpt", "langchain memory", "pinecone", "weaviate", "chroma", "redis"]

competition_override:
  ai engineer: 0.6
  indie hacker: 0.4
  startup: 0.5
  enterprise: 0.5
  researcher: 0.4

rank_weights:
  volume: 0.4
  intent: 0.4
  competition: 0.2

max_posts_per_source: 20
lead_count: 8
model: gemini-3.6-flash
